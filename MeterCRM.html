<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13233A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home Solar">
<title>Home Solar Monitoring</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Home Solar Monitoring","short_name":"Home Solar","start_url":".","display":"standalone","background_color":"%2313233A","theme_color":"%2313233A","icons":[]}'>
<style>
:root{
  --navy:#13233A; --blue:#1E60D6; --bg:#EEF1F6; --card:#FFFFFF; --line:#DCE2EC;
  --text:#1B2430; --muted:#6B7686; --c1:#E8663B; --c2:#2D7DD2; --c3:#2BB673;
  --good:#1F9D55; --warn:#C2410C; --gold:#F4C84A;
}
/* ---------- splash / starting page ---------- */
#splash{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 18%,#1b3354 0%,#13233A 55%,#0d1a2c 100%);
  color:#fff;transition:opacity .45s ease;text-align:center;padding:24px;
}
#splash.hide{opacity:0;pointer-events:none}
.sp-inner{display:flex;flex-direction:column;align-items:center;max-width:340px;animation:spRise .7s ease both}
@keyframes spRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sp-logo{width:96px;height:96px;margin-bottom:22px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));animation:spPop .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes spPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.sp-name{font-size:27px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.sp-tag{margin-top:8px;font-size:13px;color:#AEB9CC;letter-spacing:.4px}
.sp-rule{width:46px;height:3px;border-radius:2px;background:var(--gold);margin:22px 0 16px;opacity:.9}
.sp-by{display:flex;align-items:center;gap:9px;font-size:13px;color:#C7D0DE}
.sp-by b{color:#fff;font-weight:700;letter-spacing:.2px}
.mf-logo{width:30px;height:30px;object-fit:contain;display:block}
.sp-next{margin-top:30px;background:var(--gold);color:#13233A;border:0;border-radius:30px;
  padding:14px 46px;font-size:15px;font-weight:800;letter-spacing:.3px;cursor:pointer;
  box-shadow:0 10px 24px rgba(244,200,74,.32);transition:transform .14s ease, box-shadow .14s ease;
  animation:spRise .9s ease both}
.sp-next:hover{box-shadow:0 12px 28px rgba(244,200,74,.42)}
.sp-next:active{transform:scale(.96)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.45;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
}
.app{max-width:560px;margin:0 auto;min-height:100vh}
/* top bar */
.bar{
  position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  display:flex;align-items:center;gap:10px;
}
.bar .mark{width:26px;height:26px;flex:0 0 26px}
.bar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;line-height:1.2}
.bar .sub{font-size:11px;color:#AEB9CC;margin-top:1px}
.bar select{margin-left:auto;background:#1C3252;color:#fff;border:1px solid #2b466e;
  border-radius:8px;padding:7px 9px;font-size:14px;max-width:42%}
.wrap{padding:16px}
h2.view{font-size:20px;margin:2px 2px 12px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
/* cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card .top{height:4px}
.card .pad{padding:13px 14px}
.card .lbl{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.card .val{font-size:24px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.card .sub{font-size:11px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px}
.legend span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.chartscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* tables */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;font-size:13px;text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
   border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
td{border-bottom:1px solid #F0F3F8}
th:first-child,td:first-child{text-align:left}
tr.tot td{background:#EEF3FB;font-weight:700}
.tblscroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.readrow:active{background:#EAF1FF}
.unit{color:var(--muted)}
/* buttons */
.btn{appearance:none;border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;
  background:var(--blue);color:#fff;cursor:pointer}
.btn.ghost{background:#E3E9F2;color:var(--text)}
.btn.danger{background:#C0392B;color:#fff}
.btn.block{display:block;width:100%}
.btnrow{display:flex;gap:8px;margin:4px 0 14px}
.btnrow .btn{flex:1}
/* settlement */
.calc{background:#F7F9FC;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.calc .f{font-size:12.5px;color:var(--muted)}
.calc .r{font-size:16px;font-weight:800;margin-top:5px}
.kv{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #F0F3F8;font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700}
/* form fields */
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:9px 0 7px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer}
.nav button .ic{display:block;font-size:19px;line-height:1;margin-bottom:3px}
.nav button.active{color:var(--blue)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(13,20,32,.5);z-index:50;display:none;align-items:flex-end}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 10px}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty .big{font-size:40px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#13233A;color:#fff;
  padding:10px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

const KEY = "metercrm_v1";
const MA = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let DB = load();
let view = "dash";
let curMonth = lastMonthName();
let curQ = null;

function load(){ try{const s=localStorage.getItem(KEY); return s?JSON.parse(s):clone(SEED);}catch(e){return clone(SEED);} }
function save(){ try{localStorage.setItem(KEY, JSON.stringify(DB));}catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function nf(n){ return (n==null||isNaN(n))?"":Number(n).toLocaleString("en-US",{maximumFractionDigits:0}); }
function lastMonthName(){ const m=(SEED.months||[]); return m.length?m[m.length-1].name:null; }
function monthByName(n){ return DB.months.find(m=>m.name===n); }

function computeUnits(reads){
  let prev={r1:null,r2:null,r3:null}, out=[];
  for(const row of reads){
    let u={};
    for(const k of ["r1","r2","r3"]){
      const cur=row[k], pv=prev[k];
      u[k]=(typeof cur==="number"&&typeof pv==="number"&&cur>=pv)?cur-pv:null;
      if(typeof cur==="number") prev[k]=cur;
    }
    out.push({...row,u1:u.r1,u2:u.r2,u3:u.r3});
  }
  return out;
}
function monthTotals(m){
  const r=computeUnits(m.readings||[]); let t=[0,0,0];
  for(const x of r){ if(typeof x.u1==="number")t[0]+=x.u1; if(typeof x.u2==="number")t[1]+=x.u2; if(typeof x.u3==="number")t[2]+=x.u3; }
  return t;
}
function nameToYm(name){
  name=(name||"").trim();
  for(let i=1;i<MA.length;i++){ if(name.toLowerCase().startsWith(MA[i].toLowerCase())){
    const yy=name.slice(MA[i].length).replace(/\D/g,""); if(yy.length===2) return "20"+yy+"-"+String(i).padStart(2,"0");
  }}
  return null;
}
function ratesForYm(ym){
  if(!ym) return {};
  const [y,mo]=ym.split("-"); const nm=MA[+mo]+y.slice(2); const m=monthByName(nm);
  return m?(m.rates||{}):{};
}
function actualSaving(ym){ const s=(DB.summary||[]).find(x=>x.month===ym); return s?s.saving:null; }
function quarterLabel(ym){ const [y,mo]=ym.split("-"); return y+"-Q"+(Math.floor((+mo-1)/3)+1); }
function groupQuarters(){
  const out={}, order=[];
  for(const s of (DB.summary||[])){ const q=quarterLabel(s.month); if(!out[q]){out[q]=[];order.push(q);} out[q].push(s); }
  return order.map(q=>[q,out[q]]);
}
function settlement(peak,off,exp,rates){
  const bb=rates.buyback, pr=rates.peak;
  if(bb==null||pr==null) return null;
  const credit=(exp-off)*bb, peakCost=peak*pr;
  return {val:credit-peakCost, credit, peakCost, bb, pr};
}

// map a month's 3 channel labels to canonical {peak,offpeak,export} column indexes
function canonMap(ch){
  let map={};
  (ch||[]).forEach((label,i)=>{
    const l=(label||"").toLowerCase(); let key=null;
    if(l.includes("export")) key="export";
    else if(l.includes("off")) key="offpeak";
    else if(l.includes("peak")) key="peak";
    else if(l.includes("import")) key="peak";
    if(key && !(key in map)) map[key]=i;
  });
  return ("peak" in map && "offpeak" in map && "export" in map) ? map : null;
}

// recompute a month's entry in DB.summary from its daily readings (called on every edit)
function syncSummary(m){
  if(!m) return;
  const ym=nameToYm(m.name); if(!ym) return;
  if(!DB.summary) DB.summary=[];
  let entry=DB.summary.find(s=>s.month===ym);
  const cm=canonMap(m.channels||[]);
  const t=monthTotals(m); // [ch0,ch1,ch2]
  const reads=m.readings||[];
  const lastR=i=>{const k=["r1","r2","r3"][i]; for(let j=reads.length-1;j>=0;j--){ if(typeof reads[j][k]==="number") return reads[j][k]; } return null;};
  let nets,closes;
  if(cm){ nets={peak:t[cm.peak],offpeak:t[cm.offpeak],export:t[cm.export]};
          closes={peak:lastR(cm.peak),offpeak:lastR(cm.offpeak),export:lastR(cm.export)}; }
  else  { nets={peak:t[0],offpeak:t[1],export:t[2]};
          closes={peak:lastR(0),offpeak:lastR(1),export:lastR(2)}; }
  // don't wipe a good historical entry with empty/placeholder readings
  if(entry && (entry.peak.net||entry.offpeak.net||entry.export.net) &&
     !(nets.peak||nets.offpeak||nets.export)) return;
  if(!entry){ entry={month:ym,saving:null}; DB.summary.push(entry); }
  const prevSaving=entry.saving;
  entry.peak   ={net:nets.peak,   close:closes.peak};
  entry.offpeak={net:nets.offpeak,close:closes.offpeak};
  entry.export ={net:nets.export, close:closes.export};
  if(prevSaving==null){ const st=settlement(nets.peak,nets.offpeak,nets.export,m.rates||{}); entry.saving=st?Math.round(st.val):null; }
  else entry.saving=prevSaving;
  DB.summary.sort((a,b)=>a.month<b.month?-1:1);
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===view));
  const app=document.getElementById("app");
  if(view==="dash") app.innerHTML=vDash();
  else if(view==="read") app.innerHTML=vRead();
  else if(view==="qtr") app.innerHTML=vQtr();
  else if(view==="set") app.innerHTML=vSet();
  bindCtx();
  if(view==="dash") drawChart();
}

function ctxBar(html){ const s=document.getElementById("ctxsel"); if(html){s.style.display="";s.innerHTML=html;} else {s.style.display="none";s.innerHTML="";} }
function bindCtx(){
  const s=document.getElementById("ctxsel");
  s.onchange=()=>{
    if(view==="dash"||view==="read") curMonth=s.value;
    else if(view==="qtr") curQ=s.value;
    render();
  };
}

function vDash(){
  const names=DB.months.map(m=>m.name);
  if(!names.length) return empty("No data yet. Add a month under Setup.");
  if(!names.includes(curMonth)) curMonth=names[names.length-1];
  ctxBar(names.map(n=>`<option ${n===curMonth?"selected":""}>${n}</option>`).join(""));
  document.getElementById("barsub").textContent = monthByName(curMonth).meter_ref ? ("Meter "+monthByName(curMonth).meter_ref) : "by MarkFold Digital";
  const m=monthByName(curMonth), ch=m.channels||["Ch1","Ch2","Ch3"], t=monthTotals(m);
  const ym=nameToYm(m.name), act=actualSaving(ym);
  const cc=["var(--c1)","var(--c2)","var(--c3)"];
  let cards="";
  for(let i=0;i<3;i++) cards+=card(ch[i],nf(t[i]),"units this month",cc[i]);
  cards+= act!=null ? card("Saving","Rs "+nf(act),"this month",`var(--good)`)
                    : card("Net","Rs —","set rates","var(--good)");
  return `<h2 class="view">Dashboard</h2>
    <div class="cards">${cards}</div>
    <div class="panel">
      <h3>Monthly units by channel</h3>
      <div class="legend">
        <span><i class="dot" style="background:var(--c1)"></i>${ch[0]}</span>
        <span><i class="dot" style="background:var(--c2)"></i>${ch[1]}</span>
        <span><i class="dot" style="background:var(--c3)"></i>${ch[2]}</span>
      </div>
      <div class="chartscroll"><div id="chart"></div></div>
    </div>`;
}
function card(lbl,val,sub,color){
  return `<div class="card"><div class="top" style="background:${color}"></div>
    <div class="pad"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub}</div></div></div>`;
}
function drawChart(){
  const data=DB.months.map(m=>[m.name,monthTotals(m)]);
  const peak=Math.max(1,...data.map(d=>Math.max(...d[1])));
  const step=Math.pow(10,Math.max(0,String(Math.round(peak)).length-2));
  const top=Math.ceil(peak/step)*step||peak;
  const groupW=46, padL=38, padB=34, padT=8, H=240, plotH=H-padT-padB;
  const W=padL+data.length*groupW+10;
  const cc=["var(--c1)","var(--c2)","var(--c3)"];
  let s=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;
  for(let g=0;g<=4;g++){ const y=padT+plotH*g/4, val=top*(1-g/4);
    s+=`<line x1="${padL}" y1="${y}" x2="${W-6}" y2="${y}" stroke="#EEF1F6"/>`;
    s+=`<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#6B7686">${nf(val)}</text>`;
  }
  data.forEach((d,gi)=>{
    const gx=padL+groupW*gi+groupW/2, bw=10;
    d[1].forEach((v,i)=>{ const bh=(v/top)*plotH, x=gx+(i-1)*(bw+1)-bw/2, y=padT+plotH-bh;
      s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" rx="2" fill="${cc[i]}"/>`; });
    s+=`<text x="${gx}" y="${H-padB+14}" text-anchor="middle" font-size="8.5" fill="#6B7686">${d[0].replace("25","'25").replace("26","'26").trim()}</text>`;
  });
  s+=`<line x1="${padL}" y1="${padT+plotH}" x2="${W-6}" y2="${padT+plotH}" stroke="#DCE2EC"/></svg>`;
  document.getElementById("chart").innerHTML=s;
}

  document.getElementById("barsub").textContent="Quarterly settlement";
  const rows=qs.find(q=>q[0]===curQ)[1];
  const ml=rows.map(r=>{const [y,mo]=r.month.split("-");return MA[+mo]+" "+y;});
  const T={};
  ["peak","offpeak","export"].forEach(ch=>{ T[ch]=rows.reduce((a,r)=>a+(r[ch].net||0),0); });
  const closing=k=>rows[rows.length-1][k].close;
  const disp={peak:"Peak (Import)",offpeak:"Off-peak (Import)",export:"Export"};
  let trows="";
  ["peak","offpeak","export"].forEach(ch=>{
    const n=rows.map(r=>r[ch].net||0); while(n.length<3)n.push(0);
    trows+=`<tr><td>${disp[ch]}</td><td>${nf(n[0])}</td><td>${nf(n[1])}</td><td>${nf(n[2])}</td><td><b>${nf(T[ch])}</b></td><td>${nf(closing(ch))}</td></tr>`;
  });
  const rates=ratesForYm(rows[rows.length-1].month);
  const st=settlement(T.peak,T.offpeak,T.export,rates);
  const saving=rows.reduce((a,r)=>a+(r.saving||0),0);
  const netUnits=T.export-T.offpeak-T.peak;
  let calc;
  if(!st) calc=`<div class="calc"><div class="f" style="color:var(--warn)">Set Buyback and Peak rates under Setup to calculate the settlement.</div></div>`;
  else calc=`<div class="calc">
      <div class="small" style="font-weight:700">Est. settlement</div>
      <div class="f">(Export ${nf(T.export)} − Off-peak ${nf(T.offpeak)}) × Rs ${st.bb} − Peak ${nf(T.peak)} × Rs ${st.pr}</div>

    </div>`;

  // all quarters
  let arows=""; let g={peak:0,offpeak:0,export:0,sav:0,set:0};
  qs.forEach(([q,qr])=>{
    const pk=qr.reduce((a,r)=>a+(r.peak.net||0),0), op=qr.reduce((a,r)=>a+(r.offpeak.net||0),0),
          ex=qr.reduce((a,r)=>a+(r.export.net||0),0), sv=qr.reduce((a,r)=>a+(r.saving||0),0);
    const s2=settlement(pk,op,ex,ratesForYm(qr[qr.length-1].month));
    g.peak+=pk;g.offpeak+=op;g.export+=ex;g.sav+=sv; if(s2)g.set+=s2.val;
    arows+=`<tr><td>${q}</td><td>${nf(pk)}</td><td>${nf(op)}</td><td>${nf(ex)}</td><td>${s2?nf(s2.val):"—"}</td><td>${nf(sv)}</td></tr>`;
  });
  arows+=`<tr class="tot"><td>Total</td><td>${nf(g.peak)}</td><td>${nf(g.offpeak)}</td><td>${nf(g.export)}</td><td>${nf(g.set)}</td><td>${nf(g.sav)}</td></tr>`;

  return `<h2 class="view">Quarterly</h2>
    <div class="panel">
      <h3>${curQ}</h3>
      <div class="small muted" style="margin-bottom:8px">${ml.join("  →  ")}</div>
      <div class="tblscroll"><table>
        <thead><tr><th>Channel</th><th>${ml[0]||""}</th><th>${ml[1]||""}</th><th>${ml[2]||""}</th><th>Total</th><th>Close</th></tr></thead>
        <tbody>${trows}</tbody></table></div>
      ${calc}
      <div class="kv"><span class="muted">Net (Export − Off-peak − Peak)</span><b>${nf(netUnits)} units</b></div>
      <div class="kv"><span class="muted">Quarter saving (actual)</span><b style="color:var(--good)">Rs ${nf(saving)}</b></div>
    </div>
    <div class="panel">
      <h3>All quarters</h3>
      <div class="tblscroll"><table>
        <thead><tr><th>Qtr</th><th>Peak</th><th>Off-pk</th><th>Export</th><th>Settle</th><th>Saving</th></tr></thead>
        <tbody>${arows}</tbody></table></div>
    </div>`;
}

function vSet(){
  ctxBar("");
  document.getElementById("barsub").textContent="Setup & rates";
  const opts=DB.months.map(m=>`<option ${m.name===curMonth?"selected":""}>${m.name}</option>`).join("");
  const m=monthByName(curMonth)||DB.months[DB.months.length-1];
  if(!m) return `<h2 class="view">Setup</h2>${empty("No months. Add one below.")}<button class="btn block" onclick="newMonth()">+ New month</button>`;
  const ch=m.channels||["","",""], r=m.rates||{};
  return `<h2 class="view">Setup</h2>
    <div class="panel">
      <div class="field"><label>Month</label>
        <select id="setmonth" onchange="curMonth=this.value;render()" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px">${opts}</select></div>
      <div class="field"><label>Meter reference</label><input id="f_ref" value="${esc(m.meter_ref||"")}"></div>
      <div class="field"><label>Channel 1 label</label><input id="f_c1" value="${esc(ch[0]||"")}"></div>
      <div class="field"><label>Channel 2 label</label><input id="f_c2" value="${esc(ch[1]||"")}"></div>
      <div class="field"><label>Channel 3 label</label><input id="f_c3" value="${esc(ch[2]||"")}"></div>
      <div class="field"><label>Peak rate (Rs/unit)</label><input id="f_peak" inputmode="decimal" value="${r.peak??""}"></div>
      <div class="field"><label>Off-peak rate (Rs/unit)</label><input id="f_off" inputmode="decimal" value="${r.offpeak??""}"></div>
      <div class="field"><label>Buyback rate (Rs/unit)</label><input id="f_bb" inputmode="decimal" value="${r.buyback??""}"></div>
      <div class="btnrow">
        <button class="btn" onclick="saveMonth('${esc(m.name)}')">Save changes</button>
        <button class="btn danger" onclick="delMonth('${esc(m.name)}')">Delete</button>
      </div>
    </div>
    <div class="panel">
      <h3>Data</h3>
      <div class="btnrow"><button class="btn ghost" onclick="newMonth()">+ New month</button>
      <button class="btn ghost" onclick="exportCSV()">Export CSV</button></div>
      <button class="btn danger block" onclick="resetData()">Reset to original data</button>
      <div class="tiny muted" style="margin-top:8px">Everything is saved on this device. “Reset” restores the readings imported from your spreadsheet.</div>
    </div>
    <div style="text-align:center;color:var(--muted);font-size:12px;padding:6px 0 4px">
      Home Solar Monitoring · v1.0<br>by <b style="color:var(--text)">MarkFold Digital</b>
    </div>`;
}

/* ---------- actions ---------- */
function editRow(i){
  const m=monthByName(curMonth), r=m.readings[i], ch=m.channels;
  openSheet(`<h3>${r.date}</h3>
    <div class="field"><label>Date</label><input id="e_date" value="${r.date}"></div>
    <div class="field"><label>${ch[0]} reading</label><input id="e_r1" inputmode="decimal" value="${r.r1??""}"></div>
    <div class="field"><label>${ch[1]} reading</label><input id="e_r2" inputmode="decimal" value="${r.r2??""}"></div>
    <div class="field"><label>${ch[2]} reading</label><input id="e_r3" inputmode="decimal" value="${r.r3??""}"></div>
    <div class="btnrow">
      <button class="btn" onclick="saveRow(${i})">Save</button>
      <button class="btn danger" onclick="delRow(${i})">Delete</button>
    </div>
    <button class="btn ghost block" onclick="closeSheet()">Cancel</button>`);
}
function val(id){ const v=document.getElementById(id).value.trim(); return v===""?null:Number(v); }
function saveRow(i){
  const m=monthByName(curMonth), d=document.getElementById("e_date").value.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast("Use date format YYYY-MM-DD"); return; }
  m.readings[i]={date:d,r1:val("e_r1"),r2:val("e_r2"),r3:val("e_r3")};
  m.readings.sort((a,b)=>a.date<b.date?-1:1);
  syncSummary(m); save(); closeSheet(); render(); toast("Saved");
}
function delRow(i){ const m=monthByName(curMonth); m.readings.splice(i,1); syncSummary(m); save(); closeSheet(); render(); toast("Deleted"); }
function addDay(){
  const m=monthByName(curMonth), reads=m.readings;
  let nd, prev={r1:null,r2:null,r3:null};
  if(reads.length){ const last=reads[reads.length-1]; const dt=new Date(last.date+"T00:00:00"); dt.setDate(dt.getDate()+1);
    nd=dt.toISOString().slice(0,10); prev={r1:last.r1,r2:last.r2,r3:last.r3}; }
  else nd=new Date().toISOString().slice(0,10);
  reads.push({date:nd,...prev}); save(); render();
  const i=reads.length-1; editRow(i);
}
function saveMonth(name){
  const m=monthByName(name);
  m.meter_ref=document.getElementById("f_ref").value.trim();
  m.channels=[document.getElementById("f_c1").value.trim()||"Ch1",
              document.getElementById("f_c2").value.trim()||"Ch2",
              document.getElementById("f_c3").value.trim()||"Ch3"];
  const rr={}; const p=val2("f_peak"),o=val2("f_off"),b=val2("f_bb");
  if(p!=null)rr.peak=p; if(o!=null)rr.offpeak=o; if(b!=null)rr.buyback=b;
  m.rates=rr; syncSummary(m); save(); render(); toast("Saved");
}
function val2(id){ const v=document.getElementById(id).value.trim(); return v===""?null:Number(v); }
function delMonth(name){
  askConfirm("Delete month "+name+" and all its readings?",function(){
    const ym=nameToYm(name);
    DB.months=DB.months.filter(m=>m.name!==name);
    if(ym&&DB.summary) DB.summary=DB.summary.filter(s=>s.month!==ym);
    curMonth=DB.months.length?DB.months[DB.months.length-1].name:null; save(); render(); toast("Deleted");
  });
}
function newMonth(){
  askText("New month","e.g. Jul26",function(name){
    if(!name) return;
    if(monthByName(name)){ toast("That month already exists"); return; }
    const prev=DB.months[DB.months.length-1];
    const nm={ name:name,
      meter_ref: prev?(prev.meter_ref||""):"",
      channels: prev?prev.channels.slice():["Peak","Off-peak","Export"],
      rates: prev?Object.assign({},prev.rates):{},
      readings:[] };
    DB.months.push(nm); syncSummary(nm);
    curMonth=name; save(); render(); toast("Month added — ref & rates carried over");
  });
}
function resetData(){ askConfirm("Restore the original imported data? Your edits will be lost.",function(){ DB=clone(SEED); save(); curMonth=lastMonthName(); render(); toast("Restored"); }); }
function exportCSV(){
  let csv="Month,Date,Ch1,Ch1 Read,Ch1 Units,Ch2,Ch2 Read,Ch2 Units,Ch3,Ch3 Read,Ch3 Units\n";
  for(const m of DB.months){ const ch=m.channels;
    for(const r of computeUnits(m.readings||[])) csv+=[m.name,r.date,ch[0],r.r1,r.u1,ch[1],r.r2,r.u2,ch[2],r.r3,r.u3].map(x=>x==null?"":x).join(",")+"\n";
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="meter_readings.csv"; a.click(); toast("CSV downloaded");
}

/* ---------- ui plumbing ---------- */
function askText(title,ph,cb){
  openSheet(`<h3>${title}</h3>
    <div class="field"><input id="ask_in" placeholder="${esc(ph||'')}"></div>
    <div class="btnrow"><button class="btn" id="ask_ok">OK</button>
    <button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
  const inp=document.getElementById("ask_in"); setTimeout(()=>{try{inp.focus();}catch(e){}},60);
  const go=()=>{ const v=inp.value.trim(); closeSheet(); cb(v); };
  document.getElementById("ask_ok").onclick=go;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}
function askConfirm(msg,cb){
  openSheet(`<h3>Please confirm</h3>
    <p style="margin:0 0 14px">${esc(msg)}</p>
    <div class="btnrow"><button class="btn danger" id="cf_ok">Yes, continue</button>
    <button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
  document.getElementById("cf_ok").onclick=()=>{ closeSheet(); cb(); };
}
function empty(msg){ return `<div class="empty"><div class="big">📂</div><div>${msg}</div></div>`; }
function esc(s){ return String(s).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function openSheet(html){ const o=document.getElementById("overlay"); document.getElementById("sheet").innerHTML=html; o.classList.add("show"); }
function closeSheet(){ document.getElementById("overlay").classList.remove("show"); }
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeSheet(); });
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1600); }
document.getElementById("nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b){ view=b.dataset.v; render(); window.scrollTo(0,0);} });

render();

/* starting page: waits for the Next button */
function hideSplash(){ const s=document.getElementById("splash"); if(s&&!s.classList.contains("hide")){ s.classList.add("hide"); setTimeout(()=>{ if(s.parentNode) s.remove(); },500); } }
</script>
</body>
