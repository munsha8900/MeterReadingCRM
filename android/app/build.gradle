plugins {
    id 'com.android.application' version '8.5.2'
}
android {
    namespace 'com.markfold.metercrm'
    compileSdk 34
    defaultConfig {
        applicationId "com.markfold.metercrm"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug { }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
